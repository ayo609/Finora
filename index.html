<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Finora • Create Your Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-blue: #3b82f6;
      --sky-blue: #60a5fa;
      --light-blue: #93c5fd;
      --dark-blue: #1e40af;
      --navy-blue: #1e3a5f;
      --white: #ffffff;
      --off-white: #f8fafc;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --gradient-blue: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
      --gradient-dark-blue: linear-gradient(135deg, #1e3a5f 0%, #1e40af 100%);
    }

    html {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Animated background shapes */
    .bg-shape {
      position: fixed;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(147, 197, 253, 0.15));
      animation: float 20s infinite;
      pointer-events: none;
      z-index: 0;
    }
    .shape-1 { width: 300px; height: 300px; top: -100px; right: -100px; }
    .shape-2 { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-delay: -5s; }
    .shape-3 { width: 150px; height: 150px; top: 50%; left: 5%; animation-delay: -10s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(20px, -20px) rotate(120deg); }
      66% { transform: translate(-15px, 15px) rotate(240deg); }
    }

    /* Grid pattern overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 0.5rem auto;
    }

    .registration-card {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: visible;
      width: 100%;
    }

    .registration-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-blue);
      border-radius: 20px 20px 0 0;
    }

    .card-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .mobile-logo {
      width: 60px;
      height: 60px;
      background: var(--gradient-blue);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      margin-bottom: 0.8rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .card-header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.3rem;
    }

    .card-header p {
      color: var(--gray-500);
      font-size: 0.85rem;
    }

    .bonus-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .bonus-banner .gift-icon {
      font-size: 1.1rem;
    }

    .bonus-banner span {
      font-size: 0.8rem;
      color: var(--dark-blue);
      font-weight: 500;
      text-align: center;
    }

    .bonus-banner strong {
      color: #2563eb;
      font-weight: 700;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .field-group {
      position: relative;
      width: 100%;
    }

    .field-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.3rem;
      letter-spacing: 0.3px;
    }

    .field-group label .required {
      color: #ef4444;
      margin-left: 2px;
    }

    .field-group label .optional {
      color: var(--gray-400);
      font-weight: 400;
      font-size: 0.7rem;
      margin-left: 4px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 0.85rem;
      pointer-events: none;
      transition: color 0.3s;
      z-index: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.7rem 0.8rem 0.7rem 2.4rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      color: var(--gray-800);
      background: var(--gray-50);
      transition: all 0.3s;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-blue);
      background: white;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .input-wrapper input:focus ~ .input-icon {
      color: var(--primary-blue);
    }

    .input-wrapper input::placeholder {
      color: var(--gray-400);
      font-size: 0.8rem;
    }

    .input-wrapper input.input-error {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .input-wrapper input.input-valid {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem;
      transition: color 0.3s;
      z-index: 2;
    }

    .password-toggle:hover {
      color: var(--primary-blue);
    }

    .feedback-message {
      font-size: 0.68rem;
      margin-top: 0.25rem;
      display: none;
      align-items: center;
      gap: 0.3rem;
      font-weight: 500;
    }

    .feedback-message.show {
      display: flex;
    }

    .feedback-message.error {
      color: #ef4444;
    }

    .feedback-message.success {
      color: #10b981;
    }

    .feedback-message.checking {
      color: var(--primary-blue);
    }

    .password-strength {
      margin-top: 0.3rem;
      height: 4px;
      background: var(--gray-100);
      border-radius: 10px;
      overflow: hidden;
    }

    .password-strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.4s;
      border-radius: 10px;
    }

    .password-strength-fill.weak { width: 25%; background: #ef4444; }
    .password-strength-fill.fair { width: 50%; background: #f59e0b; }
    .password-strength-fill.good { width: 75%; background: #3b82f6; }
    .password-strength-fill.strong { width: 100%; background: #10b981; }

    .password-hint {
      font-size: 0.68rem;
      color: var(--gray-400);
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .terms-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .terms-checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--primary-blue);
      cursor: pointer;
      flex-shrink: 0;
    }

    .terms-checkbox label {
      font-size: 0.75rem;
      color: var(--gray-500);
      line-height: 1.4;
      cursor: pointer;
    }

    .terms-checkbox a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .terms-checkbox a:hover {
      text-decoration: underline;
    }

    .submit-button {
      width: 100%;
      padding: 0.8rem;
      background: var(--gradient-blue);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
      letter-spacing: 0.3px;
      margin-top: 0.5rem;
    }

    .submit-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.4);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--gray-500);
    }

    .login-link a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: var(--dark-blue);
    }

    /* Toast notifications */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      background: white;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 0.7rem;
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      min-width: 280px;
      max-width: 90vw;
      border-left: 4px solid var(--primary-blue);
    }

    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      background: #d1fae5;
      color: #059669;
    }

    .toast.error .toast-icon {
      background: #fee2e2;
      color: #dc2626;
    }

    .toast.warning .toast-icon {
      background: #fed7aa;
      color: #d97706;
    }

    .toast-content h4 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 0.1rem;
    }

    .toast-content p {
      font-size: 0.7rem;
      color: var(--gray-500);
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      body {
        padding: 0.3rem;
      }

      .registration-card {
        padding: 1.2rem;
        border-radius: 16px;
      }

      .card-header h1 {
        font-size: 1.3rem;
      }

      .mobile-logo {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
      }

      .form-section {
        gap: 0.7rem;
      }

      .input-wrapper input {
        padding: 0.65rem 0.7rem 0.65rem 2.2rem;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      .registration-card {
        padding: 1rem;
      }

      .bonus-banner span {
        font-size: 0.75rem;
      }

      .submit-button {
        font-size: 0.85rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <div class="main-container">
    <div class="registration-card">
      
      <!-- Header -->
      <div class="card-header">
        <div class="mobile-logo">💎</div>
        <h1>Create Account</h1>
        <p>Join Finora and start your wealth journey</p>
      </div>

      <!-- Welcome Bonus Banner -->
      <div class="bonus-banner">
        <span class="gift-icon">🎁</span>
        <span>Get <strong>₦500</strong> Welcome Bonus in Deposit Wallet!</span>
      </div>

      <form id="registerForm" class="form-section">
        
        <!-- Full Name -->
        <div class="field-group">
          <label>Full Name <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="regName" placeholder="Enter your full name" required minlength="2" autocomplete="name">
          </div>
        </div>

        <!-- Username -->
        <div class="field-group">
          <label>Username <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-at input-icon"></i>
            <input type="text" id="regUsername" placeholder="Your referral ID" required minlength="3" maxlength="20" pattern="[a-z0-9]+" autocomplete="username">
          </div>
          <div class="feedback-message" id="usernameFeedback"></div>
        </div>

        <!-- Mobile Number -->
        <div class="field-group">
          <label>Mobile Number <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-mobile-alt input-icon"></i>
            <input type="tel" id="regPhone" placeholder="08012345678" required pattern="[0-9]{10,15}" autocomplete="tel">
          </div>
        </div>

        <!-- Email -->
        <div class="field-group">
          <label>Email Address <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label>Password <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="regPassword" placeholder="Create password" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="regPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength-fill" id="strengthBar"></div>
          </div>
          <div class="password-hint" id="passwordHint">
            <i class="fas fa-info-circle"></i> Minimum 8 characters
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="field-group">
          <label>Confirm Password <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt input-icon"></i>
            <input type="password" id="regConfirmPassword" placeholder="Confirm password" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="regConfirmPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Referral Code -->
        <div class="field-group">
          <label>Referral Code <span class="optional">(Optional)</span></label>
          <div class="input-wrapper">
            <i class="fas fa-user-plus input-icon"></i>
            <input type="text" id="regReferral" placeholder="Enter referral username">
          </div>
          <div class="feedback-message" id="referralFeedback"></div>
        </div>

        <!-- Terms -->
        <div class="terms-checkbox">
          <input type="checkbox" id="regTerms" required>
          <label>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-button" id="regSubmitBtn">
          <i class="fas fa-rocket"></i> Create Free Account
        </button>

        <!-- Login Link -->
        <div class="login-link">
          Already have an account? <a href="login.html">Sign In</a>
        </div>

      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, serverTimestamp, increment, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCLkkB9LhiD1vyEQ0W1EEzxBsSuL4e9HrE",
      authDomain: "finora-397cd.firebaseapp.com",
      projectId: "finora-397cd",
      storageBucket: "finora-397cd.firebasestorage.app",
      messagingSenderId: "860666862619",
      appId: "1:860666862619:web:bb82a7518630034339ecbe"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const WELCOME_BONUS = 500;
    const REFERRAL_RATES = { 1: 20, 2: 3, 3: 1 };

    // Toast notification function
    function showToast(title, message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle'
      };
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">
          <i class="fas ${icons[type]}"></i>
        </div>
        <div class="toast-content">
          <h4>${title}</h4>
          <p>${message}</p>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        if (toast.parentNode) {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(20px)';
          toast.style.transition = 'all 0.3s';
          setTimeout(() => toast.remove(), 300);
        }
      }, 5000);
    }

    // Password toggle
    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    // Find user by username (without limit)
    async function findUserByUsername(username) {
      const usersRef = collection(db, 'users');
      const q = query(usersRef, where('username', '==', username.toLowerCase()));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        return null;
      }
      
      const userDoc = querySnapshot.docs[0];
      return { id: userDoc.id, ...userDoc.data() };
    }

    // Pre-fill referral from URL
    const urlParams = new URLSearchParams(window.location.search);
    const refParam = urlParams.get('ref');
    if (refParam) {
      document.getElementById('regReferral').value = refParam;
      verifyReferralCode(refParam);
    }

    let verifiedReferrerId = null;
    let checkTimeout;

    // Username availability check
    document.getElementById('regUsername').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      const fb = document.getElementById('usernameFeedback');
      
      clearTimeout(checkTimeout);
      
      if (val.length < 3) {
        fb.className = 'feedback-message';
        e.target.classList.remove('input-valid', 'input-error');
        return;
      }
      
      if (!/^[a-z0-9]+$/.test(val)) {
        fb.innerHTML = '<i class="fas fa-times-circle"></i> Only letters & numbers';
        fb.className = 'feedback-message show error';
        e.target.classList.add('input-error');
        e.target.classList.remove('input-valid');
        return;
      }
      
      fb.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
      fb.className = 'feedback-message show checking';
      
      checkTimeout = setTimeout(async () => {
        try {
          const exists = await findUserByUsername(val);
          if (exists) {
            fb.innerHTML = '<i class="fas fa-times-circle"></i> Username taken';
            fb.className = 'feedback-message show error';
            e.target.classList.add('input-error');
            e.target.classList.remove('input-valid');
          } else {
            fb.innerHTML = '<i class="fas fa-check-circle"></i> Username available';
            fb.className = 'feedback-message show success';
            e.target.classList.add('input-valid');
            e.target.classList.remove('input-error');
          }
        } catch (error) {
          console.error('Error checking username:', error);
          fb.className = 'feedback-message';
        }
      }, 600);
    });

    // Referral code verification
    document.getElementById('regReferral').addEventListener('input', (e) => {
      const code = e.target.value.toLowerCase().trim();
      const fb = document.getElementById('referralFeedback');
      
      verifiedReferrerId = null;
      clearTimeout(checkTimeout);
      
      if (!code || code.length < 3) {
        fb.className = 'feedback-message';
        e.target.classList.remove('input-valid', 'input-error');
        return;
      }
      
      fb.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
      fb.className = 'feedback-message show checking';
      
      checkTimeout = setTimeout(async () => {
        try {
          const ref = await findUserByUsername(code);
          if (ref) {
            verifiedReferrerId = ref.id;
            fb.innerHTML = `<i class="fas fa-check-circle"></i> Referred by ${ref.fullName || ref.username}`;
            fb.className = 'feedback-message show success';
            e.target.classList.add('input-valid');
            e.target.classList.remove('input-error');
          } else {
            fb.innerHTML = '<i class="fas fa-times-circle"></i> Invalid referral code';
            fb.className = 'feedback-message show error';
            e.target.classList.add('input-error');
            e.target.classList.remove('input-valid');
          }
        } catch (error) {
          console.error('Error checking referral:', error);
          fb.className = 'feedback-message';
        }
      }, 600);
    });

    async function verifyReferralCode(code) {
      try {
        const ref = await findUserByUsername(code);
        if (ref) {
          verifiedReferrerId = ref.id;
          document.getElementById('referralFeedback').innerHTML = `<i class="fas fa-check-circle"></i> Referred by ${ref.fullName || ref.username}`;
          document.getElementById('referralFeedback').className = 'feedback-message show success';
          document.getElementById('regReferral').classList.add('input-valid');
        }
      } catch (error) {
        console.error('Error verifying referral:', error);
      }
    }

    // Password strength checker
    document.getElementById('regPassword').addEventListener('input', (e) => {
      const pw = e.target.value;
      const bar = document.getElementById('strengthBar');
      const hint = document.getElementById('passwordHint');
      
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.match(/[a-z]/) && pw.match(/[A-Z]/)) score++;
      if (pw.match(/[0-9]/)) score++;
      if (pw.match(/[^a-zA-Z0-9]/)) score++;
      
      bar.className = 'password-strength-fill';
      
      if (score <= 1) {
        bar.classList.add('weak');
        hint.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Weak password';
      } else if (score === 2) {
        bar.classList.add('fair');
        hint.innerHTML = '<i class="fas fa-chart-line"></i> Fair password';
      } else if (score === 3) {
        bar.classList.add('good');
        hint.innerHTML = '<i class="fas fa-check-circle"></i> Good password';
      } else {
        bar.classList.add('strong');
        hint.innerHTML = '<i class="fas fa-shield-alt"></i> Strong password!';
      }
    });

    // Password match checker
    document.getElementById('regConfirmPassword').addEventListener('input', (e) => {
      const match = document.getElementById('regPassword').value === e.target.value;
      e.target.classList.toggle('input-error', !match && e.target.value.length > 0);
      e.target.classList.toggle('input-valid', match && e.target.value.length > 0);
    });

    // Registration form submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('regSubmitBtn');
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUsername').value.trim().toLowerCase();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const referralCode = document.getElementById('regReferral').value.trim().toLowerCase();
      const termsChecked = document.getElementById('regTerms').checked;

      // Validation
      if (name.length < 2) return showToast('Invalid Name', 'Please enter your full name', 'error');
      if (username.length < 3) return showToast('Invalid Username', 'Username must be at least 3 characters', 'error');
      if (!/^[a-z0-9]+$/.test(username)) return showToast('Invalid Username', 'Only letters & numbers allowed', 'error');
      if (!phone.match(/^[0-9]{10,15}$/)) return showToast('Invalid Phone', 'Please enter a valid mobile number', 'error');
      if (password.length < 8) return showToast('Weak Password', 'Minimum 8 characters required', 'error');
      if (password !== confirmPassword) return showToast('Password Mismatch', 'Passwords do not match', 'error');
      if (!termsChecked) return showToast('Terms Required', 'Please accept the terms to continue', 'warning');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

      try {
        // Check username availability
        const usernameExists = await findUserByUsername(username);
        if (usernameExists) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-rocket"></i> Create Free Account';
          return showToast('Username Taken', 'Please choose another username', 'error');
        }

        // Build referral chain
        let finalReferrer = verifiedReferrerId;
        if (!finalReferrer && referralCode) {
          const refData = await findUserByUsername(referralCode);
          if (refData) finalReferrer = refData.id;
        }

        let level1Referrer = null, level2Referrer = null, level3Referrer = null;
        
        if (finalReferrer) {
          level1Referrer = finalReferrer;
          try {
            const l1Doc = await getDoc(doc(db, 'users', finalReferrer));
            
            if (l1Doc.exists()) {
              const l1Data = l1Doc.data();
              if (l1Data.referredBy) {
                level2Referrer = l1Data.referredBy;
                try {
                  const l2Doc = await getDoc(doc(db, 'users', l1Data.referredBy));
                  if (l2Doc.exists() && l2Doc.data().referredBy) {
                    level3Referrer = l2Doc.data().referredBy;
                  }
                } catch (err) {
                  console.warn('Error fetching level 2 referrer:', err);
                }
              }
            }
          } catch (err) {
            console.warn('Error fetching level 1 referrer:', err);
          }
        }

        // Create authentication
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        const newUserId = credential.user.uid;
        await updateProfile(credential.user, { displayName: name });

        // Create user document with separate wallets
        await setDoc(doc(db, 'users', newUserId), {
          uid: newUserId,
          fullName: name,
          username: username,
          email: email,
          phone: phone,
          role: 'user',
          status: 'active',
          referredBy: level1Referrer || null,
          level2Referrer: level2Referrer || null,
          level3Referrer: level3Referrer || null,
          depositWallet: WELCOME_BONUS,
          withdrawalWallet: 0,
          totalDeposits: 0,
          totalWithdrawals: 0,
          totalEarnings: WELCOME_BONUS,
          totalRefEarnings: 0,
          activeInvestments: 0,
          referralCount: 0,
          level1Count: 0,
          level2Count: 0,
          level3Count: 0,
          emailVerified: false,
          isAdmin: false,
          createdAt: serverTimestamp(),
          lastLogin: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        // Welcome bonus transaction
        await setDoc(doc(collection(db, `users/${newUserId}/transactions`)), {
          type: 'welcome_bonus',
          amount: WELCOME_BONUS,
          wallet: 'deposit',
          status: 'completed',
          description: '🎁 Welcome Bonus — Credited to Deposit Wallet',
          createdAt: serverTimestamp()
        });

        // Build referral chain
        if (level1Referrer) {
          let currentUpliner = level1Referrer;
          const levels = [
            { level: 1, rate: REFERRAL_RATES[1] },
            { level: 2, rate: REFERRAL_RATES[2] },
            { level: 3, rate: REFERRAL_RATES[3] }
          ];

          for (const lvl of levels) {
            if (!currentUpliner) break;

            try {
              await setDoc(doc(db, `users/${currentUpliner}/referrals`, newUserId), {
                referredUserId: newUserId,
                referredUserName: name,
                referredUserEmail: email,
                referredUsername: username,
                level: lvl.level,
                commission: lvl.rate,
                referredAt: serverTimestamp(),
                totalEarned: 0,
                lastInvestment: null
              });

              await updateDoc(doc(db, 'users', currentUpliner), {
                referralCount: increment(lvl.level === 1 ? 1 : 0),
                [`level${lvl.level}Count`]: increment(1),
                updatedAt: serverTimestamp()
              });
            } catch (chainErr) {
              console.warn(`Level ${lvl.level} chain warning:`, chainErr);
            }

            try {
              const uplinerDoc = await getDoc(doc(db, 'users', currentUpliner));
              if (uplinerDoc.exists()) {
                const ud = uplinerDoc.data();
                currentUpliner = lvl.level === 1 ? ud.referredBy :
                                lvl.level === 2 ? ud.level2Referrer : null;
              } else {
                break;
              }
            } catch {
              break;
            }
          }
        }

        showToast('🎉 Welcome to Finora!', `₦${WELCOME_BONUS.toLocaleString()} added to Deposit Wallet!`, 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);

      } catch (error) {
        console.error('Registration error:', error);
        
        let message = 'Please try again.';
        if (error.code === 'auth/email-already-in-use') message = 'Email already registered.';
        else if (error.code === 'auth/invalid-email') message = 'Invalid email format.';
        else if (error.code === 'auth/weak-password') message = 'Password too weak.';
        else if (error.code === 'auth/operation-not-allowed') message = 'Email/password sign-in not enabled.';
        else if (error.code === 'permission-denied') message = 'Permission error. Check Firestore rules.';
        else message = error.message || 'Registration failed.';
        
        showToast('Registration Failed', message, 'error');
        
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rocket"></i> Create Free Account';
      }
    });

    console.log('✅ Finora Registration Page Ready');
  </script>
</body>
</html>
