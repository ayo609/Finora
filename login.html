<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Finova Ads/Telecom • Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-blue: #2563eb;
      --sky-blue: #38bdf8;
      --light-blue: #7dd3fc;
      --dark-blue: #1e40af;
      --navy-blue: #172554;
      --white: #ffffff;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --green-500: #10b981;
      --green-100: #d1fae5;
      --red-500: #ef4444;
      --red-100: #fee2e2;
      --yellow-500: #f59e0b;
      --yellow-100: #fef3c7;
      --gradient-ads: linear-gradient(135deg, #0ea5e9 0%, #2563eb 50%, #7c3aed 100%);
    }

    html {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Manrope', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f5f3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0.5rem auto;
    }

    .login-card {
      background: white;
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 50px rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(14, 165, 233, 0.1);
      position: relative;
      overflow: visible;
      width: 100%;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-ads);
      border-radius: 24px 24px 0 0;
    }

    .card-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: var(--gradient-ads);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      margin-bottom: 0.8rem;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
    }

    .card-header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.3rem;
      letter-spacing: -0.5px;
    }

    .card-header p {
      color: var(--gray-500);
      font-size: 0.85rem;
    }

    .login-method-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      background: var(--gray-50);
      border-radius: 12px;
      padding: 0.3rem;
    }

    .method-tab {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--gray-500);
      font-family: 'Manrope', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .method-tab.active {
      background: white;
      color: var(--primary-blue);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .method-tab i {
      font-size: 0.9rem;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .field-group {
      position: relative;
      width: 100%;
    }

    .field-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }

    .field-group label .required {
      color: #dc2626;
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 0.9rem;
      pointer-events: none;
      transition: color 0.3s;
      z-index: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 0.8rem 0.75rem 2.6rem;
      border: 2px solid var(--gray-200);
      border-radius: 14px;
      font-size: 0.88rem;
      font-family: 'Manrope', sans-serif;
      color: var(--gray-800);
      background: var(--gray-50);
      transition: all 0.3s;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
    }

    .input-wrapper input:focus ~ .input-icon {
      color: var(--primary-blue);
    }

    .input-wrapper input::placeholder {
      color: var(--gray-400);
      font-size: 0.82rem;
    }

    .input-wrapper input.input-error {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .input-wrapper input.input-valid {
      border-color: #059669;
      background: #f0fdf4;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem;
      transition: color 0.3s;
      z-index: 2;
    }

    .password-toggle:hover {
      color: var(--primary-blue);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.3rem;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .remember-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-blue);
      cursor: pointer;
    }

    .remember-wrap span {
      font-size: 0.75rem;
      color: var(--gray-500);
    }

    .forgot-link {
      color: var(--primary-blue);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .submit-button {
      width: 100%;
      padding: 0.85rem;
      background: var(--gradient-ads);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Sora', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
      letter-spacing: 0.3px;
      margin-top: 0.5rem;
    }

    .submit-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(14, 165, 233, 0.4);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--gray-500);
    }

    .register-link a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .register-link a:hover {
      color: var(--dark-blue);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      background: white;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      min-width: 280px;
      max-width: 90vw;
      border-left: 4px solid var(--primary-blue);
    }

    .toast.success { border-left-color: #059669; }
    .toast.error { border-left-color: #dc2626; }
    .toast.warning { border-left-color: #f59e0b; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      background: #d1fae5;
      color: #059669;
    }

    .toast.error .toast-icon {
      background: #fee2e2;
      color: #dc2626;
    }

    .toast.warning .toast-icon {
      background: #fed7aa;
      color: #d97706;
    }

    .toast-content h4 {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.1rem;
    }

    .toast-content p {
      font-size: 0.72rem;
      color: var(--gray-500);
    }

    @media (max-width: 480px) {
      body {
        padding: 0.3rem;
      }

      .login-card {
        padding: 1.5rem 1rem;
        border-radius: 20px;
      }

      .card-header h1 {
        font-size: 1.3rem;
      }

      .brand-logo {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
      }

      .form-section {
        gap: 0.7rem;
      }

      .input-wrapper input {
        padding: 0.7rem 0.7rem 0.7rem 2.4rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 360px) {
      .login-card {
        padding: 1.2rem 0.8rem;
      }

      .submit-button {
        font-size: 0.85rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="main-container">
    <div class="login-card">
      
      <!-- Header -->
      <div class="card-header">
        <div class="brand-logo">
          <i class="fas fa-broadcast-tower"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your Finova Ads/Telecom account</p>
      </div>

      <!-- Login Method Tabs -->
      <div class="login-method-tabs">
        <button class="method-tab active" id="usernameTab">
          <i class="fas fa-at"></i> Username
        </button>
        <button class="method-tab" id="phoneTab">
          <i class="fas fa-mobile-alt"></i> Phone
        </button>
      </div>

      <form id="loginForm" class="form-section">
        
        <!-- Username/Phone Input -->
        <div class="field-group">
          <label id="loginLabel">Username <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-at input-icon" id="loginIcon"></i>
            <input type="text" id="loginIdentifier" placeholder="Enter your username" required>
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label>Password <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" data-target="loginPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="options-row">
          <label class="remember-wrap">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-button" id="loginSubmitBtn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <!-- Register Link -->
        <div class="register-link">
          Don't have an account? <a href="index.html">Create Account</a>
        </div>

      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLkkB9LhiD1vyEQ0W1EEzxBsSuL4e9HrE",
      authDomain: "finora-397cd.firebaseapp.com",
      projectId: "finora-397cd",
      storageBucket: "finora-397cd.firebasestorage.app",
      messagingSenderId: "860666862619",
      appId: "1:860666862619:web:bb82a7518630034339ecbe"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentLoginMethod = 'username';

    function showToast(title, message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle'
      };
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">
          <i class="fas ${icons[type]}"></i>
        </div>
        <div class="toast-content">
          <h4>${title}</h4>
          <p>${message}</p>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        if (toast.parentNode) {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(20px)';
          toast.style.transition = 'all 0.3s';
          setTimeout(() => toast.remove(), 300);
        }
      }, 5000);
    }

    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    document.getElementById('usernameTab').addEventListener('click', () => {
      currentLoginMethod = 'username';
      document.getElementById('usernameTab').classList.add('active');
      document.getElementById('phoneTab').classList.remove('active');
      document.getElementById('loginLabel').innerHTML = 'Username <span class="required">*</span>';
      document.getElementById('loginIcon').className = 'fas fa-at input-icon';
      document.getElementById('loginIdentifier').placeholder = 'Enter your username';
      document.getElementById('loginIdentifier').value = '';
      document.getElementById('loginIdentifier').type = 'text';
      document.getElementById('loginIdentifier').pattern = '[a-z0-9]+';
    });

    document.getElementById('phoneTab').addEventListener('click', () => {
      currentLoginMethod = 'phone';
      document.getElementById('phoneTab').classList.add('active');
      document.getElementById('usernameTab').classList.remove('active');
      document.getElementById('loginLabel').innerHTML = 'Phone Number <span class="required">*</span>';
      document.getElementById('loginIcon').className = 'fas fa-mobile-alt input-icon';
      document.getElementById('loginIdentifier').placeholder = 'Enter your phone number';
      document.getElementById('loginIdentifier').value = '';
      document.getElementById('loginIdentifier').type = 'tel';
      document.getElementById('loginIdentifier').pattern = '[0-9]{10,15}';
    });

    async function findUserByUsername(username) {
      const usersRef = collection(db, 'users');
      const q = query(usersRef, where('username', '==', username.toLowerCase()));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        return null;
      }
      
      const userDoc = querySnapshot.docs[0];
      return { id: userDoc.id, ...userDoc.data() };
    }

    async function findUserByPhone(phone) {
      const usersRef = collection(db, 'users');
      const q = query(usersRef, where('phone', '==', phone));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        return null;
      }
      
      const userDoc = querySnapshot.docs[0];
      return { id: userDoc.id, ...userDoc.data() };
    }

    document.querySelector('.forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      
      const identifier = document.getElementById('loginIdentifier').value.trim();
      
      if (!identifier) {
        return showToast('Input Required', 'Please enter your username or phone first', 'warning');
      }
      
      let email = null;
      
      try {
        if (currentLoginMethod === 'username') {
          const user = await findUserByUsername(identifier);
          if (user) email = user.email;
        } else {
          const user = await findUserByPhone(identifier);
          if (user) email = user.email;
        }
        
        if (!email) {
          return showToast('User Not Found', 'No account found with this information', 'error');
        }
        
        await sendPasswordResetEmail(auth, email);
        showToast('Reset Email Sent', 'Check your email for password reset instructions', 'success');
        
      } catch (error) {
        console.error('Password reset error:', error);
        showToast('Reset Failed', 'Unable to send reset email', 'error');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('loginSubmitBtn');
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!identifier) {
        return showToast('Input Required', currentLoginMethod === 'username' ? 'Enter your username' : 'Enter your phone number', 'warning');
      }
      
      if (!password) {
        return showToast('Password Required', 'Enter your password', 'warning');
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

      try {
        let userData = null;
        let email = null;
        
        if (currentLoginMethod === 'username') {
          userData = await findUserByUsername(identifier.toLowerCase());
        } else {
          userData = await findUserByPhone(identifier);
        }
        
        if (!userData) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          return showToast('User Not Found', currentLoginMethod === 'username' ? 'No account with this username' : 'No account with this phone number', 'error');
        }
        
        // Check if user is suspended
        if (userData.status === 'suspended') {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          return showToast('Account Suspended', 'Your account has been suspended. Contact support.', 'error');
        }
        
        email = userData.email;
        
        if (!email) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          return showToast('Error', 'Account email not found', 'error');
        }
        
        const persistenceType = rememberMe ? browserLocalPersistence : browserSessionPersistence;
        await setPersistence(auth, persistenceType);
        
        await signInWithEmailAndPassword(auth, email, password);
        
        if (rememberMe) {
          localStorage.setItem('finora_email', email);
          localStorage.setItem('finora_identifier', identifier);
          localStorage.setItem('finora_login_method', currentLoginMethod);
        } else {
          localStorage.removeItem('finora_email');
          localStorage.removeItem('finora_identifier');
          localStorage.removeItem('finora_login_method');
        }
        
        try {
          await updateDoc(doc(db, 'users', userData.id), {
            lastLogin: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        } catch (updateError) {
          console.warn('Error updating last login:', updateError);
        }
        
        showToast('Welcome Back!', 'Redirecting to dashboard...', 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        
      } catch (error) {
        console.error('Login error:', error);
        
        let message = 'Please try again.';
        if (error.code === 'auth/wrong-password') {
          message = 'Incorrect password.';
        } else if (error.code === 'auth/user-not-found') {
          message = 'No account found.';
        } else if (error.code === 'auth/invalid-credential') {
          message = 'Invalid credentials.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many attempts. Try again later.';
        } else if (error.code === 'auth/network-request-failed') {
          message = 'Network error. Check your connection.';
        }
        
        showToast('Login Failed', message, 'error');
        
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });

    const savedIdentifier = localStorage.getItem('finora_identifier');
    const savedLoginMethod = localStorage.getItem('finora_login_method');
    
    if (savedIdentifier && savedLoginMethod) {
      document.getElementById('loginIdentifier').value = savedIdentifier;
      
      if (savedLoginMethod === 'phone') {
        document.getElementById('phoneTab').click();
      } else {
        document.getElementById('usernameTab').click();
      }
      
      document.getElementById('rememberMe').checked = true;
    }

    console.log('Finova Ads/Telecom Login Page Ready');
  </script>
</body>
</html>
